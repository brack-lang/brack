name: release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform: [ x86_64-linux, aarch64-linux, x86_64-darwin, aarch64-darwin ]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: brack-lang
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build ".#packages.${{ matrix.platform }}.package"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: result
  tag:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Get current version
        id: version
        run: |
          echo "version=$(cat ./VERSION)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: brack-x86_64-linux
          path: x86_64-linux
      - uses: actions/download-artifact@v4
        with:
          name: brack-aarch64-linux
          path: aarch64-linux
      - uses: actions/download-artifact@v4
        with:
          name: brack-x86_64-darwin
          path: x86_64-darwin
      - uses: actions/download-artifact@v4
        with:
          name: brack-aarch64-darwin
          path: aarch64-darwin
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') }}
          generate_release_notes: true
        files: |
          x86_64-linux/*
          aarch64-linux/*
          x86_64-darwin/*
          aarch64-darwin/*

